/configure card 1 card-type iom4-e-b
/configure card 1 mda 1 mda-type me40-1gb-csfp
/configure sfm 1 sfm-type m-sfm5-7
/configure port 1/1/1 admin-state enable
/configure router "Base" interface "system" ipv4 primary address 10.255.0.3
/configure router "Base" interface "system" ipv4 primary prefix-length 32
/configure router "Base" interface "to-border" port 1/1/1
/configure router "Base" interface "to-border" ipv4 primary address 10.0.1.2
/configure router "Base" interface "to-border" ipv4 primary prefix-length 30
/configure router "Base" isis 0 admin-state enable
/configure router "Base" isis 0 level-capability 1
/configure router "Base" isis 0 system-id 0000.0000.0003
/configure router "Base" isis 0 area-address [49.0002]
/configure router "Base" isis 0 level 1 wide-metrics-only true
/configure router "Base" isis 0 interface "system" passive true
/configure router "Base" isis 0 interface "to-border" interface-type point-to-point
