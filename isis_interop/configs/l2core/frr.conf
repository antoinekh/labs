hostname l2core
!
interface lo
 ip address 10.255.0.1/32
 ip router isis LAB
 isis passive
!
interface eth1
 ip address 10.0.0.1/30
 ip router isis LAB
 isis circuit-type level-2-only
 isis network point-to-point
 no isis hello padding
!
router isis LAB
 net 49.0003.0000.0000.0001.00
 is-type level-2-only
 metric-style wide
!
